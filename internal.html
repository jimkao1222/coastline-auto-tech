<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workshop — Coastline Auto Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<style>
  :root{
    --navy:#141414; --navy-light:#8A8378; --sidebar-hover:#262626;
    --bg:#1A1A1A; --card:#242424; --border:#3A362E;
    --ink:#EDEAE2; --ink-soft:#A39C8E;
    --blue:#C9A227; --blue-dark:#A6841E;
    --green:#4CAF7D; --amber:#D9A441; --coral:#D97D5D; --red:#E2726B;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}

  #loginScreen{max-width:380px;margin:100px auto;padding:0 20px;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:30px 28px;box-shadow:0 4px 20px rgba(0,0,0,.3);}
  .login-card h1{font-size:20px;font-weight:600;margin:0 0 4px;color:var(--ink);}
  .login-card p{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}
  label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-bottom:14px;}
  input,select{display:block;width:100%;margin-top:6px;padding:9px 11px;background:#1E1E1E;border:1px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);}
  input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(201,162,39,.2);}
  .btn-primary{font-weight:600;font-size:13.5px;color:#1A1A1A;background:var(--blue);border:none;border-radius:8px;padding:10px 16px;cursor:pointer;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-ghost{font-weight:500;font-size:12.5px;color:var(--ink-soft);background:#1E1E1E;border:1px solid var(--border);border-radius:8px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn-ghost:hover{border-color:var(--blue);color:var(--blue);}
  .msg{margin-top:12px;padding:10px 13px;border-radius:8px;font-size:13px;display:none;}
  .msg.show{display:block;}
  .msg.err{background:rgba(226,114,107,.15);color:var(--red);}
  .msg.ok{background:rgba(76,175,125,.15);color:var(--green);}

  #appShell{display:none;min-height:100vh;}
  .sidebar{width:72px;background:var(--navy);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:24px;flex-shrink:0;position:fixed;top:0;bottom:0;left:0;}
  .sidebar .logo{font-size:24px;color:var(--blue);margin-bottom:8px;}
  .sidebar a, .sidebar button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--navy-light);text-decoration:none;background:none;border:none;cursor:pointer;font-size:20px;}
  .sidebar a:hover, .sidebar button:hover{background:var(--sidebar-hover);color:var(--ink);}
  .sidebar a.active{background:var(--blue);color:#1A1A1A;}

  main{margin-left:72px;padding:32px 40px 60px;max-width:900px;}
  .page-title{font-size:20px;font-weight:600;margin:0 0 20px;color:var(--ink);}
  .section-title{font-size:15px;font-weight:600;color:var(--ink);margin:32px 0 14px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:16px;}
  .card:last-child{margin-bottom:0;}

  .job-card{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;}
  .job-info b{font-size:14.5px;color:var(--ink);}
  .job-info .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .job-info .desc{font-size:12.5px;color:var(--ink-soft);margin-top:5px;max-width:50ch;}
  .job-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

  .pill{font-size:11px;padding:3px 10px;border-radius:20px;text-transform:capitalize;font-weight:500;}
  .pill.pending{background:rgba(217,164,65,.15);color:var(--amber);}
  .pill.confirmed{background:rgba(76,175,125,.15);color:var(--green);}
  .pill.in_progress{background:rgba(201,162,39,.15);color:var(--blue);}
  .pill.completed{background:rgba(255,255,255,.06);color:var(--ink-soft);}
  .pill.waiting_for_parts{background:rgba(217,125,93,.15);color:var(--coral);}
  .pill.on_hold{background:rgba(255,255,255,.06);color:var(--ink-soft);}

  .action{font-size:12px;font-weight:500;padding:7px 12px;border-radius:7px;cursor:pointer;border:1px solid var(--border);background:#1E1E1E;color:var(--ink-soft);text-decoration:none;display:inline-block;}
  .action.primary{background:var(--blue);border-color:var(--blue);color:#1A1A1A;}
  .action.primary:hover{background:var(--blue-dark);}
  .action:hover{border-color:var(--ink-soft);color:var(--ink);}
  .del-btn{color:var(--red);background:none;border:none;cursor:pointer;font-size:11.5px;text-decoration:underline;}

  .new-wo-panel .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .wo-mode{font-size:12px;font-weight:500;padding:8px 12px;border:1px solid var(--border);background:#1E1E1E;color:var(--ink-soft);cursor:pointer;border-radius:8px;}
  .wo-mode.active{background:var(--blue);border-color:var(--blue);color:#1A1A1A;}
  .empty{font-size:13.5px;color:var(--ink-soft);padding:12px 0;}

  @media (max-width:700px){ main{padding:24px 18px;} .new-wo-panel .row2{grid-template-columns:1fr;} }
</style>
</head>
<body>

<section id="loginScreen">
  <div class="login-card">
    <h1>Staff login</h1>
    <p>Coastline Auto Tech — for workshop use only.</p>
    <form id="loginForm">
      <label>Email<input required type="email" id="email" autocomplete="username" /></label>
      <label>Password<input required type="password" id="password" autocomplete="current-password" /></label>
      <button type="submit" class="btn-primary" style="width:100%" id="loginBtn">Log in</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>
</section>

<div id="appShell">
  <nav class="sidebar">
    <i class="ti ti-anchor logo"></i>
    <a href="control.html" title="Home"><i class="ti ti-layout-dashboard"></i></a>
    <a href="internal.html" class="active" title="Bookings and work orders"><i class="ti ti-tool"></i></a>
    <a href="invoices.html" title="Invoices"><i class="ti ti-receipt-2"></i></a>
    <a href="reports.html" title="Reports"><i class="ti ti-chart-bar"></i></a>
    <a href="settings.html" title="Settings"><i class="ti ti-settings"></i></a>
    <button id="logoutBtn" title="Log out"><i class="ti ti-logout"></i></button>
  </nav>

  <main>
    <p class="page-title">Booking queue</p>
    <div id="apptList"><p class="empty">Loading…</p></div>

    <p class="section-title">Work orders <span style="font-weight:400;color:var(--ink-soft)">(all)</span></p>
    <input id="woSearch" placeholder="Search by customer, rego, or vehicle…" style="margin-bottom:14px" />

    <div class="card new-wo-panel">
      <button type="button" class="action primary" id="toggleNewWoBtn">+ New work order</button>
      <div id="newWoForm" style="display:none;margin-top:14px">
        <div style="display:flex;gap:8px;margin-bottom:14px">
          <button type="button" class="wo-mode active" data-mode="existing">Existing customer</button>
          <button type="button" class="wo-mode" data-mode="new">New customer</button>
        </div>

        <div id="existingCustBlock">
          <label>Customer<select id="existCustomerSel"><option value="">Choose a customer…</option></select></label>
          <label>Vehicle<select id="existVehicleSel"><option value="">Choose a vehicle…</option></select></label>
        </div>

        <div id="newCustBlock" style="display:none">
          <div class="row2">
            <label>Name<input id="newCustName" /></label>
            <label>Phone<input id="newCustPhone" /></label>
          </div>
          <label>Address (optional)<input id="newCustAddr" /></label>
          <div class="row2">
            <label>Rego<input id="newVehRego" style="text-transform:uppercase" /></label>
            <label>Odometer, km (optional)<input id="newVehKms" type="number" /></label>
          </div>
          <label>Make, model &amp; year<input id="newVehVehicle" placeholder="e.g. 2018 Toyota Hilux Ute" /></label>
        </div>

        <button type="button" class="btn-primary" id="createWoBtn">Create work order</button>
        <div class="msg" id="newWoMsg"></div>
      </div>
    </div>

    <div id="woList"><p class="empty">Loading…</p></div>
  </main>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL = "https://kjytblqvkwmyrudnksdp.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqeXRibHF2a3dteXJ1ZG5rc2RwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTEzMzcsImV4cCI6MjEwMTA2NzMzN30.4lONpoNVUzGQnf8ieBL8m6fa_ZmIaCIpNaVHEKOj3BI";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginScreen = document.getElementById('loginScreen');
  const appShell = document.getElementById('appShell');
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const loginMsg = document.getElementById('loginMsg');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginBtn.disabled = true; loginBtn.textContent = 'Logging in…';
    loginMsg.className = 'msg';
    const { error } = await supabase.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    if (error) {
      loginMsg.textContent = 'Wrong email or password.';
      loginMsg.classList.add('show','err');
      loginBtn.disabled = false; loginBtn.textContent = 'Log in';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => { await supabase.auth.signOut(); });

  supabase.auth.onAuthStateChange((_event, session) => {
    if (session) {
      loginScreen.style.display = 'none';
      appShell.style.display = 'block';
      loadAppointments();
      loadWorkOrders();
      loadCustomersForNewWo();
    } else {
      loginScreen.style.display = 'block';
      appShell.style.display = 'none';
    }
  });

  async function loadAppointments() {
    const listEl = document.getElementById('apptList');
    const { data, error } = await supabase
      .from('appointments')
      .select('*, customers(name, phone), vehicles(rego, vehicle)')
      .in('status', ['pending', 'confirmed'])
      .order('appointment_date', { ascending: true });

    if (error) {
      listEl.innerHTML = `<p class="empty">Couldn't load bookings: ${error.message}</p>`;
      return;
    }
    if (!data.length) {
      listEl.innerHTML = '<p class="empty">No bookings waiting right now.</p>';
      return;
    }

    listEl.innerHTML = data.map(a => `
      <div class="card job-card" data-id="${a.id}">
        <div class="job-info">
          <b>${a.customers?.name ?? 'Unknown'}</b> — ${a.vehicles?.vehicle ?? ''} (${a.vehicles?.rego ?? ''})
          <div class="meta">${a.appointment_date} · ${a.appointment_time} · ${a.service_type} · <span class="pill ${a.status}">${a.status}</span></div>
          ${a.description ? `<div class="desc">"${a.description}"</div>` : ''}
        </div>
        <div class="job-actions">
          ${a.status === 'pending' ? `<button class="action" data-confirm="${a.id}">Confirm</button>` : ''}
          <button class="action primary" data-start="${a.id}" data-customer="${a.customer_id}" data-vehicle="${a.vehicle_id}">Start work order</button>
        </div>
      </div>
    `).join('');

    listEl.querySelectorAll('[data-confirm]').forEach(btn => {
      btn.addEventListener('click', () => confirmAppointment(btn.dataset.confirm));
    });
    listEl.querySelectorAll('[data-start]').forEach(btn => {
      btn.addEventListener('click', () => startWorkOrder(btn.dataset.start, btn.dataset.customer, btn.dataset.vehicle));
    });
  }

  async function confirmAppointment(id) {
    await supabase.from('appointments').update({ status: 'confirmed' }).eq('id', id);
    loadAppointments();
  }

  async function startWorkOrder(appointmentId, customerId, vehicleId) {
    const { data, error } = await supabase.from('work_orders').insert({
      appointment_id: appointmentId,
      customer_id: customerId,
      vehicle_id: vehicleId,
      status: 'pending',
      start_time: new Date().toISOString()
    }).select('id').single();

    await supabase.from('appointments').update({ status: 'in_progress' }).eq('id', appointmentId);

    if (!error && data) {
      window.location.href = `workorder.html?id=${data.id}`;
    } else {
      loadAppointments();
      loadWorkOrders();
    }
  }

  async function loadWorkOrders() {
    const listEl = document.getElementById('woList');
    const { data, error } = await supabase
      .from('work_orders')
      .select('*, customers(name, phone), vehicles(rego, vehicle)')
      .order('created_at', { ascending: false })
      .limit(30);

    if (error) {
      listEl.innerHTML = `<p class="empty">Couldn't load work orders: ${error.message}</p>`;
      return;
    }
    if (!data.length) {
      listEl.innerHTML = '<p class="empty">No work orders yet.</p>';
      return;
    }

    listEl.innerHTML = data.map(w => `
      <div class="card job-card" data-row="${w.customers?.name ?? ''} ${w.vehicles?.rego ?? ''} ${w.vehicles?.vehicle ?? ''}">
        <div class="job-info">
          <b>${w.customers?.name ?? 'Unknown'}</b> — ${w.vehicles?.vehicle ?? ''} (${w.vehicles?.rego ?? ''})
          <div class="meta">Work order #${w.id} · <span class="pill ${w.status}">${w.status}</span></div>
        </div>
        <div class="job-actions">
          <a class="action primary" href="workorder.html?id=${w.id}">Open</a>
          ${w.status !== 'completed' ? `<button class="action" data-complete="${w.id}">Mark complete</button>` : `<a class="action" href="invoice.html?id=${w.id}">Invoice</a>`}
          <button class="del-btn" data-delwo="${w.id}" style="margin-left:6px">Delete</button>
        </div>
      </div>
    `).join('');

    listEl.querySelectorAll('[data-complete]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await supabase.from('work_orders').update({ status: 'completed', end_time: new Date().toISOString() }).eq('id', btn.dataset.complete);
        loadWorkOrders();
      });
    });
    listEl.querySelectorAll('[data-delwo]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this work order? Its parts/labour items will be deleted too. This cannot be undone.')) return;
        await supabase.from('work_orders').delete().eq('id', btn.dataset.delwo);
        loadWorkOrders();
      });
    });
  }

  document.getElementById('woSearch').addEventListener('input', () => {
    const q = document.getElementById('woSearch').value.trim().toLowerCase();
    document.querySelectorAll('#woList [data-row]').forEach(el => {
      el.style.display = el.dataset.row.toLowerCase().includes(q) ? '' : 'none';
    });
  });

  let allCustomers = [];

  document.getElementById('toggleNewWoBtn').addEventListener('click', () => {
    const form = document.getElementById('newWoForm');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  });

  document.querySelectorAll('.wo-mode').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.wo-mode').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('existingCustBlock').style.display = btn.dataset.mode === 'existing' ? 'block' : 'none';
    document.getElementById('newCustBlock').style.display = btn.dataset.mode === 'new' ? 'block' : 'none';
  }));

  async function loadCustomersForNewWo() {
    const { data } = await supabase.from('customers').select('id, name, phone').order('name');
    allCustomers = data || [];
    const sel = document.getElementById('existCustomerSel');
    sel.innerHTML = '<option value="">Choose a customer…</option>' +
      allCustomers.map(c => `<option value="${c.id}">${c.name}${c.phone ? ' — ' + c.phone : ''}</option>`).join('');
  }

  document.getElementById('existCustomerSel').addEventListener('change', async (e) => {
    const vSel = document.getElementById('existVehicleSel');
    vSel.innerHTML = '<option value="">Loading…</option>';
    if (!e.target.value) { vSel.innerHTML = '<option value="">Choose a vehicle…</option>'; return; }
    const { data } = await supabase.from('vehicles').select('id, vehicle, rego').eq('customer_id', e.target.value).order('vehicle');
    if (!data || !data.length) {
      vSel.innerHTML = '<option value="">No vehicles on file for this customer</option>';
      return;
    }
    vSel.innerHTML = '<option value="">Choose a vehicle…</option>' +
      data.map(v => `<option value="${v.id}">${v.vehicle} (${v.rego})</option>`).join('');
  });

  document.getElementById('createWoBtn').addEventListener('click', async () => {
    const msg = document.getElementById('newWoMsg'); msg.className = 'msg';
    const mode = document.querySelector('.wo-mode.active').dataset.mode;
    let customerId, vehicleId;

    if (mode === 'existing') {
      customerId = document.getElementById('existCustomerSel').value;
      vehicleId = document.getElementById('existVehicleSel').value;
      if (!customerId || !vehicleId) {
        msg.textContent = 'Choose a customer and a vehicle first.';
        msg.classList.add('show','err');
        return;
      }
    } else {
      const name = document.getElementById('newCustName').value;
      const rego = document.getElementById('newVehRego').value;
      const vehicleText = document.getElementById('newVehVehicle').value;
      if (!name || !rego || !vehicleText) {
        msg.textContent = 'Name, rego, and vehicle are required for a new customer.';
        msg.classList.add('show','err');
        return;
      }
      const { data: cust, error: custErr } = await supabase.from('customers').insert({
        name, phone: document.getElementById('newCustPhone').value || null,
        address: document.getElementById('newCustAddr').value || null
      }).select('id').single();
      if (custErr) { msg.textContent = custErr.message; msg.classList.add('show','err'); return; }
      customerId = cust.id;

      const kmsVal = document.getElementById('newVehKms').value;
      const { data: veh, error: vehErr } = await supabase.from('vehicles').insert({
        customer_id: customerId, rego: rego.toUpperCase(), vehicle: vehicleText,
        kms: kmsVal ? parseInt(kmsVal, 10) : null
      }).select('id').single();
      if (vehErr) { msg.textContent = vehErr.message; msg.classList.add('show','err'); return; }
      vehicleId = veh.id;
    }

    const { data: wo, error: woErr } = await supabase.from('work_orders').insert({
      customer_id: customerId, vehicle_id: vehicleId, status: 'pending', start_time: new Date().toISOString()
    }).select('id').single();

    if (woErr) { msg.textContent = woErr.message; msg.classList.add('show','err'); return; }
    window.location.href = `workorder.html?id=${wo.id}`;
  });
</script>

</body>
</html>
