<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Work Order — Coastline Auto Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<style>
  :root{
    --navy:#141414; --navy-light:#8A8378; --sidebar-hover:#262626;
    --bg:#1A1A1A; --card:#242424; --border:#3A362E;
    --ink:#EDEAE2; --ink-soft:#A39C8E;
    --blue:#C9A227; --blue-dark:#A6841E;
    --green:#4CAF7D; --amber:#D9A441; --coral:#D97D5D; --red:#E2726B;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}

  #loginScreen{max-width:380px;margin:100px auto;padding:0 20px;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:30px 28px;box-shadow:0 4px 20px rgba(0,0,0,.3);}
  .login-card h1{font-size:20px;font-weight:600;margin:0 0 4px;color:var(--ink);}
  .login-card p{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}
  label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-bottom:14px;}
  input,select,textarea{display:block;width:100%;margin-top:6px;padding:9px 11px;background:#1E1E1E;border:1px solid var(--border);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(201,162,39,.2);}
  .btn-primary{font-weight:600;font-size:13.5px;color:#1A1A1A;background:var(--blue);border:none;border-radius:8px;padding:10px 16px;cursor:pointer;}
  .btn-primary:hover{background:var(--blue-dark);}
  .msg{margin-top:12px;padding:10px 13px;border-radius:8px;font-size:13px;display:none;}
  .msg.show{display:block;}
  .msg.err{background:rgba(226,114,107,.15);color:var(--red);}
  .msg.ok{background:rgba(76,175,125,.15);color:var(--green);}

  #appShell{display:none;min-height:100vh;}
  .sidebar{width:72px;background:var(--navy);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:24px;flex-shrink:0;position:fixed;top:0;bottom:0;left:0;}
  .sidebar .logo{font-size:24px;color:var(--blue);margin-bottom:8px;}
  .sidebar a, .sidebar button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--navy-light);text-decoration:none;background:none;border:none;cursor:pointer;font-size:20px;}
  .sidebar a:hover, .sidebar button:hover{background:var(--sidebar-hover);color:var(--ink);}
  .sidebar a.active{background:var(--blue);color:#1A1A1A;}

  main{margin-left:72px;padding:32px 40px 60px;max-width:820px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:24px;}
  .docket-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center;}
  .docket-head b{font-size:17px;color:var(--ink);}
  .docket-head .meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
  .pill{font-size:11px;padding:3px 10px;border-radius:20px;text-transform:capitalize;font-weight:500;background:rgba(201,162,39,.15);color:var(--blue);}

  .btn-ghost{font-weight:500;font-size:12.5px;color:var(--ink-soft);background:#1E1E1E;border:1px solid var(--border);border-radius:8px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block;}
  .btn-ghost:hover{border-color:var(--blue);color:var(--blue);}

  .status-row{padding:16px 24px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;border-bottom:1px solid var(--border);}
  .status-row label{margin:0;flex:1;min-width:160px;}
  .status-row select{margin-top:6px;}

  .section-title{font-size:11px;font-weight:600;padding:18px 24px 10px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:8px 24px;border-bottom:1px solid var(--border);}
  td{padding:10px 24px;border-bottom:1px solid var(--border);color:var(--ink);}
  td.num, th.num{font-family:'IBM Plex Mono',monospace;text-align:right;}
  .rm{color:var(--red);background:none;border:none;cursor:pointer;font-size:12px;text-decoration:underline;}

  .add-form{padding:18px 24px 22px;border-bottom:1px solid var(--border);}
  .type-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .type-toggle button{flex:1;font-size:12px;font-weight:500;padding:9px;border:1px solid var(--border);background:#1E1E1E;color:var(--ink-soft);cursor:pointer;border-radius:8px;}
  .type-toggle button.active{background:var(--blue);border-color:var(--blue);color:#1A1A1A;}
  .row2{display:grid;grid-template-columns:2fr 1fr;gap:12px;}
  .stock-note{font-size:11.5px;color:var(--ink-soft);margin-top:-8px;margin-bottom:12px;}

  .summary{padding:18px 24px 24px;}
  .sum-row{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;color:var(--ink-soft);}
  .sum-row.total{font-size:16px;font-weight:600;color:var(--ink);border-top:1px solid var(--border);margin-top:8px;padding-top:12px;}
  .sum-row.profit{font-family:'IBM Plex Mono',monospace;font-weight:500;}
  .sum-row.profit.good{color:var(--green);}
  .sum-row.profit.bad{color:var(--red);}

  @media print{
    body{background:#fff;color:#000;}
    .sidebar, #loginScreen, .add-form, .status-row, .rm, .no-print{display:none !important;}
    main{margin-left:0;padding:0;max-width:none;}
    .card{border:1px solid #ccc;}
    .docket-head b, .section-title, td, th, .sum-row.total{color:#000 !important;}
    .sum-row{color:#333 !important;}
    @page{size:A4;margin:15mm;}
  }
  @media (max-width:700px){ main{padding:24px 18px;} .row2{grid-template-columns:1fr;} }
</style>
</head>
<body>

<section id="loginScreen">
  <div class="login-card">
    <h1>Staff login</h1>
    <p>Coastline Auto Tech — for workshop use only.</p>
    <form id="loginForm">
      <label>Email<input required type="email" id="email" autocomplete="username" /></label>
      <label>Password<input required type="password" id="password" autocomplete="current-password" /></label>
      <button type="submit" class="btn-primary" style="width:100%" id="loginBtn">Log in</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>
</section>

<div id="appShell">
  <nav class="sidebar no-print">
    <i class="ti ti-anchor logo"></i>
    <a href="control.html" title="Home"><i class="ti ti-layout-dashboard"></i></a>
    <a href="internal.html" class="active" title="Bookings and work orders"><i class="ti ti-tool"></i></a>
    <a href="invoices.html" title="Invoices"><i class="ti ti-receipt-2"></i></a>
    <a href="settings.html" title="Settings"><i class="ti ti-settings"></i></a>
    <button id="logoutBtn" title="Log out"><i class="ti ti-logout"></i></button>
  </nav>

  <main>
    <div class="no-print" style="margin-bottom:16px;justify-content:flex-end;display:flex">
      <button class="btn-ghost" id="printWoBtn">Print</button>
    </div>

    <div class="card">
      <div class="docket-head">
        <div>
          <b id="custName">—</b>
          <div class="meta" id="vehicleMeta">—</div>
        </div>
        <span class="pill" id="statusPill">—</span>
      </div>
      <div class="status-row no-print">
        <label>Status
          <select id="statusSelect">
            <option value="pending">Pending</option>
            <option value="in_progress">In progress</option>
            <option value="waiting_for_parts">Waiting for parts</option>
            <option value="on_hold">On hold</option>
            <option value="completed">Completed</option>
          </select>
        </label>
        <button class="btn-primary" id="updateStatusBtn">Update</button>
        <a class="btn-ghost" id="invoiceLink" href="#">Invoice</a>
      </div>

      <p class="section-title">Items on this job</p>
      <table>
        <thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Subtotal</th><th></th></tr></thead>
        <tbody id="itemsBody"></tbody>
      </table>

      <div class="add-form no-print">
        <p class="section-title" style="padding:0 0 12px">Add item</p>
        <div class="type-toggle">
          <button type="button" class="active" data-type="part">Part</button>
          <button type="button" data-type="labour">Labour</button>
          <button type="button" data-type="custom">Custom</button>
        </div>

        <div id="partFields">
          <label>Choose part<select id="partSelect"></select></label>
          <div class="row2">
            <label>Quantity<input type="number" id="partQty" value="1" min="1" /></label>
            <label>Unit price ($)<input type="number" id="partPrice" step="0.01" /></label>
          </div>
          <div class="stock-note" id="stockNote"></div>
        </div>

        <div id="labourFields" style="display:none">
          <div class="row2">
            <label>Category<select id="rateSelect"></select></label>
            <label>Hours<input type="number" id="labourHours" step="0.25" value="1" /></label>
          </div>
        </div>

        <div id="customFields" style="display:none">
          <label>Description<input type="text" id="customDesc" /></label>
          <div class="row2">
            <label>Price ($)<input type="number" id="customPrice" step="0.01" /></label>
            <label>Cost ($, optional)<input type="number" id="customCost" step="0.01" value="0" /></label>
          </div>
        </div>

        <button class="btn-primary" style="width:100%" id="addItemBtn">Add to job</button>
        <div class="msg" id="itemMsg"></div>
      </div>

      <div class="summary">
        <div class="sum-row"><span>Parts &amp; services revenue</span><span id="sumRevenue">$0.00</span></div>
        <div class="sum-row"><span>Cost of parts used</span><span id="sumCost">$0.00</span></div>
        <div class="sum-row total"><span>Total charged</span><span id="sumTotal">$0.00</span></div>
        <div class="sum-row profit"><span>Estimated profit</span><span id="sumProfit">$0.00</span></div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const SUPABASE_URL = "https://kjytblqvkwmyrudnksdp.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqeXRibHF2a3dteXJ1ZG5rc2RwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTEzMzcsImV4cCI6MjEwMTA2NzMzN30.4lONpoNVUzGQnf8ieBL8m6fa_ZmIaCIpNaVHEKOj3BI";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const workOrderId = params.get('id');

  const loginScreen = document.getElementById('loginScreen');
  const appShell = document.getElementById('appShell');
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const loginMsg = document.getElementById('loginMsg');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginBtn.disabled = true; loginBtn.textContent = 'Logging in…';
    loginMsg.className = 'msg';
    const { error } = await supabase.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    if (error) {
      loginMsg.textContent = 'Wrong email or password.';
      loginMsg.classList.add('show','err');
      loginBtn.disabled = false; loginBtn.textContent = 'Log in';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => { await supabase.auth.signOut(); });
  document.getElementById('printWoBtn').addEventListener('click', () => window.print());

  let partsCache = [];
  let ratesCache = [];

  supabase.auth.onAuthStateChange((_e, session) => {
    if (session) {
      loginScreen.style.display = 'none';
      appShell.style.display = 'block';
      init();
    } else {
      loginScreen.style.display = 'block';
      appShell.style.display = 'none';
    }
  });

  async function init() {
    if (!workOrderId) {
      document.getElementById('custName').textContent = 'No work order selected';
      return;
    }
    await Promise.all([loadPartsDropdown(), loadRatesDropdown(), loadWorkOrder()]);
  }

  async function loadWorkOrder() {
    const { data: wo, error } = await supabase
      .from('work_orders')
      .select('*, customers(name, phone), vehicles(rego, vehicle, kms)')
      .eq('id', workOrderId)
      .single();

    if (error || !wo) {
      document.getElementById('custName').textContent = 'Work order not found';
      return;
    }

    document.getElementById('custName').textContent = wo.customers?.name ?? 'Unknown';
    document.getElementById('vehicleMeta').textContent =
      `${wo.vehicles?.vehicle ?? ''} · ${wo.vehicles?.rego ?? ''} · Work order #${wo.id}`;
    document.getElementById('statusPill').textContent = wo.status;
    document.getElementById('statusSelect').value = wo.status;

    document.getElementById('updateStatusBtn').onclick = async () => {
      const newStatus = document.getElementById('statusSelect').value;
      await supabase.from('work_orders').update({ status: newStatus }).eq('id', workOrderId);
      document.getElementById('statusPill').textContent = newStatus;
    };

    document.getElementById('invoiceLink').href = `invoice.html?id=${workOrderId}`;

    await loadItems();
  }

  async function loadPartsDropdown() {
    const { data } = await supabase.from('parts_inventory').select('*').order('part_name');
    partsCache = data || [];
    const sel = document.getElementById('partSelect');
    sel.innerHTML = partsCache.map(p =>
      `<option value="${p.id}">${p.part_name} — $${p.sell_price} (${p.quantity} in stock)</option>`
    ).join('');
    updatePartFields();
    sel.addEventListener('change', updatePartFields);
  }

  function updatePartFields() {
    const part = partsCache.find(p => p.id == document.getElementById('partSelect').value);
    if (!part) return;
    document.getElementById('partPrice').value = part.sell_price;
    document.getElementById('stockNote').textContent = `Cost price: $${part.cost_price} · Currently ${part.quantity} in stock`;
  }

  async function loadRatesDropdown() {
    const { data } = await supabase.from('hourly_rates').select('*').order('service_category');
    ratesCache = data || [];
    const sel = document.getElementById('rateSelect');
    sel.innerHTML = ratesCache.map(r =>
      `<option value="${r.hourly_rate}">${r.service_category} — $${r.hourly_rate}/hr</option>`
    ).join('');
  }

  const typeButtons = document.querySelectorAll('.type-toggle button');
  typeButtons.forEach(btn => btn.addEventListener('click', () => {
    typeButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('partFields').style.display = btn.dataset.type === 'part' ? 'block' : 'none';
    document.getElementById('labourFields').style.display = btn.dataset.type === 'labour' ? 'block' : 'none';
    document.getElementById('customFields').style.display = btn.dataset.type === 'custom' ? 'block' : 'none';
  }));

  document.getElementById('addItemBtn').addEventListener('click', async () => {
    const activeType = document.querySelector('.type-toggle button.active').dataset.type;
    const itemMsg = document.getElementById('itemMsg');
    itemMsg.className = 'msg';
    let payload = { work_order_id: workOrderId };

    if (activeType === 'part') {
      const partId = document.getElementById('partSelect').value;
      const part = partsCache.find(p => p.id == partId);
      const qty = parseInt(document.getElementById('partQty').value, 10) || 1;
      const price = parseFloat(document.getElementById('partPrice').value) || 0;
      payload = { ...payload, part_id: partId, item_description: part.part_name,
        quantity: qty, unit_price: price, unit_cost: part.cost_price, subtotal: price * qty };
      await supabase.from('parts_inventory').update({ quantity: part.quantity - qty }).eq('id', partId);
    } else if (activeType === 'labour') {
      const rate = parseFloat(document.getElementById('rateSelect').value);
      const category = document.getElementById('rateSelect').selectedOptions[0].textContent.split(' —')[0];
      const hours = parseFloat(document.getElementById('labourHours').value) || 0;
      const price = rate * hours;
      payload = { ...payload, item_description: `Labour – ${hours} hrs @ $${rate}/hr (${category})`,
        quantity: 1, unit_price: price, unit_cost: 0, subtotal: price };
    } else {
      const desc = document.getElementById('customDesc').value;
      const price = parseFloat(document.getElementById('customPrice').value) || 0;
      const cost = parseFloat(document.getElementById('customCost').value) || 0;
      if (!desc) { itemMsg.textContent = 'Add a description first.'; itemMsg.classList.add('show','err'); return; }
      payload = { ...payload, item_description: desc, quantity: 1, unit_price: price, unit_cost: cost, subtotal: price };
    }

    const { error } = await supabase.from('work_order_items').insert(payload);
    if (error) {
      itemMsg.textContent = "Couldn't add that item: " + error.message;
      itemMsg.classList.add('show','err');
      return;
    }
    if (activeType === 'part') await loadPartsDropdown();
    await loadItems();
  });

  async function loadItems() {
    const { data } = await supabase.from('work_order_items').select('*').eq('work_order_id', workOrderId).order('id');
    const items = data || [];
    const body = document.getElementById('itemsBody');
    body.innerHTML = items.map(i => `
      <tr>
        <td>${i.item_description}</td>
        <td class="num">${i.quantity}</td>
        <td class="num">$${Number(i.unit_price).toFixed(2)}</td>
        <td class="num">$${Number(i.subtotal).toFixed(2)}</td>
        <td><button class="rm" data-id="${i.id}" data-part="${i.part_id ?? ''}" data-qty="${i.quantity}">Remove</button></td>
      </tr>
    `).join('') || '<tr><td colspan="5" style="color:var(--ink-soft)">No items yet.</td></tr>';

    body.querySelectorAll('.rm').forEach(btn => btn.addEventListener('click', async () => {
      if (btn.dataset.part) {
        const part = partsCache.find(p => p.id == btn.dataset.part);
        if (part) await supabase.from('parts_inventory').update({ quantity: part.quantity + parseInt(btn.dataset.qty, 10) }).eq('id', btn.dataset.part);
      }
      await supabase.from('work_order_items').delete().eq('id', btn.dataset.id);
      await loadPartsDropdown();
      await loadItems();
    }));

    const revenue = items.reduce((s, i) => s + Number(i.subtotal), 0);
    const cost = items.reduce((s, i) => s + Number(i.unit_cost) * Number(i.quantity), 0);
    const profit = revenue - cost;
    document.getElementById('sumRevenue').textContent = `$${revenue.toFixed(2)}`;
    document.getElementById('sumCost').textContent = `$${cost.toFixed(2)}`;
    document.getElementById('sumTotal').textContent = `$${revenue.toFixed(2)}`;
    const profitEl = document.getElementById('sumProfit');
    const margin = revenue > 0 ? (profit / revenue * 100).toFixed(0) : 0;
    profitEl.textContent = `$${profit.toFixed(2)} (${margin}% margin)`;
    profitEl.classList.remove('good','bad');
    profitEl.classList.add(profit >= 0 ? 'good' : 'bad');
  }
</script>

</body>
</html>
