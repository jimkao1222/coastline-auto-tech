<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Service History — Coastline Auto Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<style>
  :root{
    --navy:#141414; --navy-light:#8A8378; --sidebar-hover:#262626;
    --bg:#1A1A1A; --card:#242424; --border:#3A362E;
    --ink:#EDEAE2; --ink-soft:#A39C8E;
    --blue:#C9A227; --blue-dark:#A6841E;
    --green:#4CAF7D; --amber:#D9A441; --coral:#D97D5D; --red:#E2726B;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}

  #loginScreen{max-width:380px;margin:100px auto;padding:0 20px;}
  .login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:30px 28px;box-shadow:0 4px 20px rgba(0,0,0,.3);}
  .login-card h1{font-size:20px;font-weight:600;margin:0 0 4px;color:var(--ink);}
  .login-card p{font-size:13px;color:var(--ink-soft);margin:0 0 22px;}
  label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-bottom:14px;}
  input{display:block;width:100%;margin-top:6px;padding:9px 11px;background:#1E1E1E;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--ink);}
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(201,162,39,.2);}
  .btn-primary{font-weight:600;font-size:13.5px;color:#1A1A1A;background:var(--blue);border:none;border-radius:8px;padding:10px 16px;cursor:pointer;}
  .msg{margin-top:12px;padding:10px 13px;border-radius:8px;font-size:13px;display:none;}
  .msg.show{display:block;}
  .msg.err{background:rgba(226,114,107,.15);color:var(--red);}

  #appShell{display:none;min-height:100vh;}
  .sidebar{width:72px;background:var(--navy);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:20px 0;gap:24px;flex-shrink:0;position:fixed;top:0;bottom:0;left:0;}
  .sidebar .logo{font-size:24px;color:var(--blue);margin-bottom:8px;}
  .sidebar a, .sidebar button{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--navy-light);text-decoration:none;background:none;border:none;cursor:pointer;font-size:20px;}
  .sidebar a:hover, .sidebar button:hover{background:var(--sidebar-hover);color:var(--ink);}
  .sidebar a.active{background:var(--blue);color:#1A1A1A;}

  main{margin-left:72px;padding:32px 40px 60px;max-width:820px;}
  .back-link{font-size:12.5px;color:var(--blue);text-decoration:none;display:inline-block;margin-bottom:18px;}
  .page-title{font-size:20px;font-weight:600;margin:0 0 4px;color:var(--ink);}
  .page-sub{font-size:13px;color:var(--ink-soft);margin:0 0 22px;font-family:'IBM Plex Mono',monospace;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:10px 18px;border-bottom:1px solid var(--border);}
  td{padding:11px 18px;border-bottom:1px solid var(--border);color:var(--ink);}
  td.num{font-family:'IBM Plex Mono',monospace;text-align:right;}
  .pill{font-size:11px;padding:3px 10px;border-radius:20px;text-transform:capitalize;font-weight:500;background:rgba(201,162,39,.15);color:var(--blue);}
  a.view-link{font-size:12px;font-weight:500;color:var(--blue);text-decoration:none;}
  a.view-link:hover{color:var(--blue-dark);}
  .empty{padding:20px 18px;color:var(--ink-soft);font-size:13.5px;}

  @media (max-width:700px){ main{padding:24px 18px;} table{font-size:12px;} th,td{padding:8px 10px;} }
</style>
</head>
<body>

<section id="loginScreen">
  <div class="login-card">
    <h1>Staff login</h1>
    <p>Coastline Auto Tech — for workshop use only.</p>
    <form id="loginForm">
      <label>Email<input required type="email" id="email" autocomplete="username" /></label>
      <label>Password<input required type="password" id="password" autocomplete="current-password" /></label>
      <button type="submit" class="btn-primary" style="width:100%" id="loginBtn">Log in</button>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>
</section>

<div id="appShell">
  <nav class="sidebar">
    <i class="ti ti-anchor logo"></i>
    <a href="control.html" title="Home"><i class="ti ti-layout-dashboard"></i></a>
    <a href="internal.html" title="Bookings and work orders"><i class="ti ti-tool"></i></a>
    <a href="invoices.html" title="Invoices"><i class="ti ti-receipt-2"></i></a>
    <a href="reports.html" title="Reports"><i class="ti ti-chart-bar"></i></a>
    <a href="settings.html" class="active" title="Settings"><i class="ti ti-settings"></i></a>
    <button id="logoutBtn" title="Log out"><i class="ti ti-logout"></i></button>
  </nav>

  <main>
    <a class="back-link" href="settings.html">← Back to Vehicles</a>
    <p class="page-title" id="vehicleTitle">Service history</p>
    <p class="page-sub" id="vehicleSub">—</p>

    <div class="card">
      <table>
        <thead><tr><th>Date</th><th class="num">Odometer</th><th>Status</th><th>Job</th><th></th></tr></thead>
        <tbody id="historyBody"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  const SUPABASE_URL = "https://kjytblqvkwmyrudnksdp.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqeXRibHF2a3dteXJ1ZG5rc2RwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTEzMzcsImV4cCI6MjEwMTA2NzMzN30.4lONpoNVUzGQnf8ieBL8m6fa_ZmIaCIpNaVHEKOj3BI";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const vehicleId = params.get('id');

  const loginScreen = document.getElementById('loginScreen');
  const appShell = document.getElementById('appShell');
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const loginMsg = document.getElementById('loginMsg');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginBtn.disabled = true; loginBtn.textContent = 'Logging in…';
    loginMsg.className = 'msg';
    const { error } = await supabase.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    if (error) {
      loginMsg.textContent = 'Wrong email or password.';
      loginMsg.classList.add('show','err');
      loginBtn.disabled = false; loginBtn.textContent = 'Log in';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => { await supabase.auth.signOut(); });

  supabase.auth.onAuthStateChange((_e, session) => {
    if (session) {
      loginScreen.style.display = 'none';
      appShell.style.display = 'block';
      loadHistory();
    } else {
      loginScreen.style.display = 'block';
      appShell.style.display = 'none';
    }
  });

  async function loadHistory() {
    const body = document.getElementById('historyBody');
    if (!vehicleId) { body.innerHTML = '<tr><td colspan="5" class="empty">No vehicle selected.</td></tr>'; return; }

    const { data: veh } = await supabase.from('vehicles').select('*, customers(name)').eq('id', vehicleId).single();
    if (veh) {
      document.getElementById('vehicleTitle').textContent = `${veh.vehicle} — ${veh.rego}`;
      document.getElementById('vehicleSub').textContent = `Owner: ${veh.customers?.name ?? 'Unknown'} · Current odometer: ${veh.kms ?? '—'} km · VIN: ${veh.vin ?? '—'}`;
    }

    const { data, error } = await supabase
      .from('work_orders')
      .select('id, status, created_at, kms_at_service')
      .eq('vehicle_id', vehicleId)
      .order('created_at', { ascending: false });

    if (error) { body.innerHTML = `<tr><td colspan="5" class="empty">Couldn't load history: ${error.message}</td></tr>`; return; }
    if (!data || !data.length) { body.innerHTML = '<tr><td colspan="5" class="empty">No service history yet for this vehicle.</td></tr>'; return; }

    body.innerHTML = data.map(w => `
      <tr>
        <td>${new Date(w.created_at).toLocaleDateString()}</td>
        <td class="num">${w.kms_at_service ? w.kms_at_service.toLocaleString() + ' km' : '—'}</td>
        <td><span class="pill">${w.status}</span></td>
        <td>Work order #${w.id}</td>
        <td><a class="view-link" href="workorder.html?id=${w.id}">Open</a></td>
      </tr>
    `).join('');
  }
</script>

</body>
</html>
